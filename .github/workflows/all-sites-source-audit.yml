name: All subscribed sites source audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-ad-clean.mjs
      - run: node scripts/audit-all-sites.mjs --out=all-sites-audit.json
      - if: always()
        run: |
          if [ -f all-sites-audit.json ]; then
            echo '### All subscribed sites source audit' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat all-sites-audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
