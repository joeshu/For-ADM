name: Sanyuan unsigned iOS app
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-app/**'
      - '.github/workflows/sanyuan-ios.yml'
  pull_request:
    paths:
      - 'ios-app/**'
      - '.github/workflows/sanyuan-ios.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Begin iOS simulator first boot
        run: |
          sim_device="$(xcrun simctl list devices available --json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next(x["udid"] for k,v in d["devices"].items() if ".iOS-" in k for x in v if x.get("isAvailable") and x["name"].startswith("iPhone")))')"
          echo "SIMULATOR_UDID=$sim_device" >> "$GITHUB_ENV"
          xcrun simctl boot "$sim_device" || true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ios-app/package-lock.json
      - name: Install dependencies and test adapters
        working-directory: ios-app
        run: npm ci && npm test
      - name: Verify Swift playback state and interruption handling
        working-directory: ios-app
        run: swift test --package-path DetailPlayerStabilityKit
      - name: Verify native HLS cleaning transport
        working-directory: ios-app
        run: npm run build:web && bash tools/check-hls-macos.sh
      - name: Compile with iPhoneOS SDK and package without signing
        working-directory: ios-app
        env:
          # CFBundleVersion derives from the workflow run number (monotonic);
          # cross-build.py falls back to 61 for local builds without this env.
          SANYUAN_BUILD_NUMBER: ${{ github.run_number }}
        run: bash tools/build-macos.sh
      - name: Launch in iOS simulator and verify native media playback
        working-directory: ios-app
        run: bash tools/simulator-smoke.sh
      - name: Describe simulator failure screen
        if: failure()
        working-directory: ios-app
        run: swift tools/describe-simulator-failure.swift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sanyuan-unsigned-ipa
          overwrite: true
          # IPA filename carries the package.json version; match it by glob so
          # a version bump does not break the upload (fresh checkout = one IPA).
          path: ios-app/dist/Sanyuan-*-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sanyuan-ci-diagnostics
          overwrite: true
          path: |
            ios-app/dist/build-report.json
            ios-app/dist/simulator-smoke.json
            ios-app/dist/simulator-discover-smoke.json
            ios-app/dist/simulator-playback*.json
            ios-app/dist/simulator-navigation-debug.json
            ios-app/dist/simulator-live-smoke.json
            ios-app/dist/simulator-live-video-smoke.json
            ios-app/dist/simulator-live-video.png
            ios-app/dist/simulator-failure.png
            ios-app/dist/simulator-system.log
          if-no-files-found: warn
