name: Ad cleaner checks
on:
  push:
    paths:
      - 'universal/**'
      - 'hls-video/**'
      - 'scripts/build-hls-clean.mjs'
      - 'tests/hls-clean.test.mjs'
      - 'souju-ai/**'
      - 'yqk-qntv/**'
      - 'ycblcw/**'
      - '4kvm/**'
      - 'auete/**'
      - 'eboyang/**'
      - 'juyeye/**'
      - 'zhuiyingmiao/**'
      - 'yxxq/**'
      - 'qlplayer/**'
      - 'guazi-app/**'
      - 'scripts/build-ad-clean.mjs'
      - 'scripts/new-ad-site.mjs'
      - 'scripts/site-registry.mjs'
      - 'scripts/check-ad-clean.mjs'
      - 'scripts/lib/**'
      - 'tests/ad-*.test.mjs'
      - '.github/workflows/ad-clean-check.yml'
  pull_request:
    paths:
      - 'universal/**'
      - 'hls-video/**'
      - 'scripts/build-hls-clean.mjs'
      - 'tests/hls-clean.test.mjs'
      - 'souju-ai/**'
      - 'yqk-qntv/**'
      - 'ycblcw/**'
      - '4kvm/**'
      - 'auete/**'
      - 'eboyang/**'
      - 'juyeye/**'
      - 'zhuiyingmiao/**'
      - 'yxxq/**'
      - 'qlplayer/**'
      - 'guazi-app/**'
      - 'scripts/build-ad-clean.mjs'
      - 'scripts/new-ad-site.mjs'
      - 'scripts/site-registry.mjs'
      - 'scripts/check-ad-clean.mjs'
      - 'scripts/lib/**'
      - 'tests/ad-*.test.mjs'
      - '.github/workflows/ad-clean-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-ad-clean.mjs
      - run: node scripts/build-hls-clean.mjs --check
      - run: node --test tests/hls-clean.test.mjs
