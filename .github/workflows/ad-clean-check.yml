name: Ad cleaner checks
on:
  push:
    paths:
      - 'universal/**'
      - 'hls-video/**'
      - 'scripts/build-hls-clean.mjs'
      - 'tests/hls-*.test.mjs'
      - 'souju-ai/**'
      - 'yqk-qntv/**'
      - 'ycblcw/**'
      - '4kvm/**'
      - 'auete/**'
      - 'eboyang/**'
      - 'juyeye/**'
      - 'zhuiyingmiao/**'
      - 'yxxq/**'
      - 'qlplayer/**'
      - 'qingning-player/**'
      - '555-movie/**'
      - 'dyls/**'
      - 'kkapp/**'
      - 'ncat/**'
      - 'happ/**'
      - 'guazi-app/**'
      - 'scripts/build-ad-clean.mjs'
      - 'scripts/new-ad-site.mjs'
      - 'scripts/site-registry.mjs'
      - 'scripts/check-ad-clean.mjs'
      - 'scripts/lib/**'
      - 'tests/ad-*.test.mjs'
      - 'tests/dyls-enhanced-sources.json'
      - 'tests/dyls-v2-sources.json'
      - 'tests/dyls-sources.json'
      - 'scripts/audit-dyls-site.mjs'
      - 'scripts/audit-all-sites.mjs'
      - 'tests/kkapp-sources.json'
      - 'tests/kkapp-download-sources.json'
      - 'tests/ncat-sources.json'
      - 'tests/happ-sources.json'
      - 'tests/ncat-download-sources.json'
      - 'tests/download-hardening-sources.json'
      - 'tests/media-layout-sources.json'
      - 'tests/media-*.json'
      - 'research/media-resilience/sources/**'
      - 'research/media-resilience/*.mjs'
      - 'scripts/verify-media-archive.mjs'
      - 'vendor/acorn/**'
      - 'scripts/audit-media-sites.mjs'
      - '.github/workflows/ad-clean-check.yml'
  pull_request:
    paths:
      - 'universal/**'
      - 'hls-video/**'
      - 'scripts/build-hls-clean.mjs'
      - 'tests/hls-*.test.mjs'
      - 'souju-ai/**'
      - 'yqk-qntv/**'
      - 'ycblcw/**'
      - '4kvm/**'
      - 'auete/**'
      - 'eboyang/**'
      - 'juyeye/**'
      - 'zhuiyingmiao/**'
      - 'yxxq/**'
      - 'qlplayer/**'
      - 'qingning-player/**'
      - '555-movie/**'
      - 'dyls/**'
      - 'kkapp/**'
      - 'ncat/**'
      - 'happ/**'
      - 'guazi-app/**'
      - 'scripts/build-ad-clean.mjs'
      - 'scripts/new-ad-site.mjs'
      - 'scripts/site-registry.mjs'
      - 'scripts/check-ad-clean.mjs'
      - 'scripts/lib/**'
      - 'tests/ad-*.test.mjs'
      - 'tests/dyls-enhanced-sources.json'
      - 'tests/dyls-v2-sources.json'
      - 'tests/dyls-sources.json'
      - 'scripts/audit-dyls-site.mjs'
      - 'scripts/audit-all-sites.mjs'
      - 'tests/kkapp-sources.json'
      - 'tests/kkapp-download-sources.json'
      - 'tests/ncat-sources.json'
      - 'tests/happ-sources.json'
      - 'tests/ncat-download-sources.json'
      - 'tests/download-hardening-sources.json'
      - 'tests/media-layout-sources.json'
      - 'tests/media-*.json'
      - 'research/media-resilience/sources/**'
      - 'research/media-resilience/*.mjs'
      - 'scripts/verify-media-archive.mjs'
      - 'vendor/acorn/**'
      - 'scripts/audit-media-sites.mjs'
      - '.github/workflows/ad-clean-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/check-ad-clean.mjs
      - run: node --test research/media-resilience/updates.test.mjs
      - run: node scripts/build-hls-clean.mjs --check
      - run: node --test tests/hls-*.test.mjs
