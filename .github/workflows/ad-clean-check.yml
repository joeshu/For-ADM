name: Ad cleaner checks
on:
  push:
    paths:
      - 'universal/**'
      - 'souju-ai/**'
      - 'yqk-qntv/**'
      - 'ycblcw/**'
      - '4kvm/**'
      - 'scripts/build-ad-clean.mjs'
      - 'tests/ad-clean.test.mjs'
      - '.github/workflows/ad-clean-check.yml'
  pull_request:
    paths:
      - 'universal/**'
      - 'souju-ai/**'
      - 'yqk-qntv/**'
      - 'ycblcw/**'
      - '4kvm/**'
      - 'scripts/build-ad-clean.mjs'
      - 'tests/ad-clean.test.mjs'
      - '.github/workflows/ad-clean-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/build-ad-clean.mjs --check
      - run: node --test tests/ad-clean.test.mjs
