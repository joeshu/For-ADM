    <script>
      (function () {
        var configuredMode = "dark";
        try {
          var storedMode = window.localStorage.getItem("app.themeModePreference.v1");
          if (storedMode === "light" || storedMode === "dark") {
            configuredMode = storedMode;
          } else if (storedMode === "auto") {
            var hour = new Date().getHours();
            configuredMode = hour >= 19 || hour < 7 ? "dark" : "light";
          }
        } catch (error) {}
        var mode =
          configuredMode === "light" || configuredMode === "dark"
            ? configuredMode
            : "dark";
        var bg = mode === "light" ? "#fff2f8" : "#161619";
        var shellBg = mode === "light" ? "#FFFFFF" : "#161619";
        var text = mode === "light" ? "#161619" : "#ffffff";
        var root = document.documentElement;
        root.dataset.appThemeMode = mode;
        root.style.colorScheme = mode;
        try {
          var stableSafeTop = window.sessionStorage.getItem("h5shellStableSafeAreaTop");
          if (/^\d+(\.\d+)?px$/.test(stableSafeTop || "")) {
            root.style.setProperty("--h5shell-stable-safe-area-top", stableSafeTop);
          }
        } catch (error) {}
        root.style.setProperty("--brand-bg", bg);
        root.style.setProperty("--brand-text-primary", text);
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) themeMeta.setAttribute("content", shellBg);
        var schemeMeta = document.querySelector('meta[name="color-scheme"]');
        if (schemeMeta) schemeMeta.setAttribute("content", mode);
        var statusMeta = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]'
        );
        if (statusMeta) {
          statusMeta.setAttribute("content", mode === "light" ? "default" : "black");
        }
        try {
          if (window.H5ShellNativeBridge && typeof window.H5ShellNativeBridge.request === "function") {
            window.H5ShellNativeBridge.request("theme.setTheme", { mode: mode });
          }
        } catch (error) {}
      })();
    </script>
    <style>
      html,
      body,
      #root {

        --app-safe-top: max(var(--safe-top, 0px), var(--h5shell-stable-safe-area-top, 0px));

        min-height: 100%;

      .app-boot-skeleton__tab::after,
      .app-boot-skeleton__hero::after,
      .app-boot-skeleton__ad-icon::after,
      .app-boot-skeleton__ad-text::after,

      .app-boot-skeleton__search {
        height: 36px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.18);
      }

      .app-boot-skeleton__tabs {
        display: flex;
        gap: 14px;
        min-height: 44px;
        align-items: center;
        overflow: hidden;
      }

      .app-boot-skeleton__tab {

        height: 20px;
        flex: 0 0 auto;
        border-radius: 999px;
      }

      .app-boot-skeleton__hero {
        height: 190px;
        border-radius: 14px;
      }

      .app-boot-skeleton__ad-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
        padding: 4px 0;
      }

      .app-boot-skeleton__ad {

        min-width: 0;
        flex-direction: column;
        align-items: center;
        gap: 4px;

      .app-boot-skeleton__more {
        width: 44px;
        height: 14px;
        border-radius: 999px;
      }

      .app-boot-skeleton__grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px 8px;
      }

      .app-boot-skeleton__poster {
        aspect-ratio: 16 / 22;
        border-radius: 6px;
      }

      .app-boot-skeleton__line {
        width: 82%;
        height: 12px;
        margin-top: 8px;
        border-radius: 999px;
      }

      @media (min-width: 768px) {
        .app-boot-skeleton__nav,
        .app-boot-skeleton__content {
          padding-right: 40px;
          padding-left: 40px;
        }

        .app-boot-skeleton__hero {
          height: 320px;
        }

        .app-boot-skeleton__ad-grid {
          grid-template-columns: repeat(10, minmax(0, 1fr));
        }

        .app-boot-skeleton__grid {
          grid-template-columns: repeat(6, minmax(0, 1fr));
          gap: 16px 12px;
        }
      }

      @keyframes app-boot-skeleton-shimmer {
        100% {
          transform: translateX(100%);
        }
      }
    </style>
