# 搜剧AI：改写网站 JS 响应并隐藏广告
# 把 rewrite_local 规则合并到现有 [rewrite_local] 区段。
# 将两个域名追加进现有 [mitm] hostname 列表；保留原有项目。

[rewrite_local]
^https?://(ai\.baipiaozhe\.com|souju\.ai)/assets/(global-player-host-[^/]+|movie-card-runtime-[^/]+|main-[^/]+)\.js(?:[?#].*)?$ url script-response-body https://raw.githubusercontent.com/joeshu/For-ADM/refs/heads/master/souju-ai/js-rewrite/souju-ad-js-rewrite.js

[mitm]
hostname = ai.baipiaozhe.com, souju.ai
