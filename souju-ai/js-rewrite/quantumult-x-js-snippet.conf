# 搜剧AI：改写网站 JS 响应并注入广告隐藏样式
# 将 rewrite_local 规则合并到现有 [rewrite_local] 区段。
# 将 ai.baipiaozhe.com 追加到现有 [mitm] hostname 列表。

[rewrite_local]
^https?://ai\.baipiaozhe\.com/assets/(global-player-host-[^/]+|movie-card-runtime-[^/]+|main-[^/]+)\.js(?:[?#].*)?$ url script-response-body https://raw.githubusercontent.com/joeshu/For-ADM/refs/heads/master/souju-ai/js-rewrite/souju-ad-js-rewrite.js

[mitm]
hostname = ai.baipiaozhe.com
